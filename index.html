<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片展示</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #000;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .wrap {
            max-width: 90vw;
            max-height: 95vh;
        }
        .wrap img {
            width: 100%;
            height: auto;
            display: block;
            filter: contrast(1.15);
        }
    </style>
</head>
<body>
    <div class="wrap">
        <!-- 图片和这个html放在同一个文件夹，直接用下面这行 -->
        <img src="./anime.jpg" alt="暗黑动漫头像">
    </div>
</body>
</html>
